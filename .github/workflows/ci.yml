name: ASILGIYAH CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asilgiyah-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asilgiyah?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Check project files
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi
          if [ ! -d src ]; then
            echo "::error::The src directory was not found. Upload all ASILGIYAH project files to the repository root."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
