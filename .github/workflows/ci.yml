name: ASILGIYAH CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asilgiyah-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json was not found in the repository root. Upload the ASILGIYAH source files to the main branch, then rerun this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests when configured
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "No test script configured; skipping tests."
          fi

      - name: Build application
        run: npm run build
