services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asilgiyah
      POSTGRES_USER: asilgiyah
      POSTGRES_PASSWORD: asilgiyah_dev_password
    ports: ["5432:5432"]
    volumes: ["asilgiyah_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asilgiyah"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  asilgiyah_data: